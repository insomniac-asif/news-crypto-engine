# News Crypto Engine Configuration
# All settings in one place — no hardcoded values in source code

database:
  path: "data/news_crypto.db"
  # Auto-delete articles older than this many days (saves disk)
  retention_days: 90

# Target assets to track
assets:
  symbols:
    - BTC
    - ETH
    - SOL
    - BNB
    - XRP
    - ADA
    - DOGE
    - AVAX
    - DOT
    - MATIC
  # CoinGecko IDs mapped to symbols
  coingecko_ids:
    BTC: bitcoin
    ETH: ethereum
    SOL: solana
    BNB: binancecoin
    XRP: ripple
    ADA: cardano
    DOGE: dogecoin
    AVAX: avalanche-2
    DOT: polkadot
    MATIC: matic-network

# Price data collection
price_collection:
  # CoinGecko free API (no key required, 10-30 calls/min)
  coingecko:
    base_url: "https://api.coingecko.com/api/v3"
    rate_limit_calls: 5
    rate_limit_period: 65  # seconds — CoinGecko free tier is ~5-10/min
    retry_attempts: 5
    retry_delay: 15  # seconds — generous backoff on 429s
  # Candle granularity: hourly
  granularity: "hourly"
  # How many days of history to fetch on first run
  initial_history_days: 30

# RSS feed sources
rss_feeds:
  - name: "CoinDesk"
    url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    category: "general"
  - name: "CoinTelegraph"
    url: "https://cointelegraph.com/rss"
    category: "general"
  - name: "The Block"
    url: "https://www.theblock.co/rss.xml"
    category: "general"
  - name: "Bitcoin Magazine"
    url: "https://bitcoinmagazine.com/feed"
    category: "bitcoin"
  - name: "Decrypt"
    url: "https://decrypt.co/feed"
    category: "general"

# Reddit collection
reddit:
  # Create an app at https://www.reddit.com/prefs/apps/
  # Set these via environment variables for security:
  #   REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET, REDDIT_USER_AGENT
  client_id: "${REDDIT_CLIENT_ID}"
  client_secret: "${REDDIT_CLIENT_SECRET}"
  user_agent: "news-crypto-engine/1.0"
  subreddits:
    - "cryptocurrency"
    - "bitcoin"
    - "ethereum"
  # Fetch top N posts per subreddit per collection run
  posts_per_sub: 25
  # Minimum score to ingest
  min_score: 10

# CryptoPanic API (Phase 9)
cryptopanic:
  # Get a free API token at https://cryptopanic.com/developers/api/
  api_token: "${CRYPTOPANIC_API_TOKEN}"
  rate_limit_calls: 5
  rate_limit_period: 60
  max_pages: 3

# CCXT exchange data (Phase 9)
ccxt:
  exchange: "kraken"
  # Default timeframe: 1h for backtesting, use 15m for signal decay analysis
  timeframe: "1h"
  rate_limit_ms: 1200
  initial_history_days: 30
  # Override symbol → pair mappings if needed
  # symbol_map:
  #   BTC: "BTC/USDT"

# GDELT historical news (Phase 9)
gdelt:
  search_terms:
    - "cryptocurrency"
    - "bitcoin"
    - "ethereum"
    - "crypto regulation"
    - "SEC crypto"
    - "stablecoin"
  max_records: 250
  request_delay: 5.0  # seconds between requests (be polite)

# Scheduler settings
scheduler:
  # Collection intervals in minutes
  price_interval: 15
  rss_interval: 30
  reddit_interval: 60

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s [%(name)s] %(levelname)s: %(message)s"
  file: "data/engine.log"

# NLP settings (Phase 2)
nlp:
  spacy_model: "en_core_web_sm"
  sentiment:
    model: "vader"
    # Crypto-specific lexicon adjustments
    crypto_lexicon:
      moon: 2.5
      mooning: 3.0
      lambo: 2.0
      hodl: 1.5
      fud: -2.0
      rug: -3.5
      rugpull: -4.0
      rekt: -3.0
      dump: -2.5
      pump: 1.5
      bullish: 2.5
      bearish: -2.5
      scam: -3.5
      hack: -3.0
      exploit: -3.0
      adoption: 2.0
      partnership: 1.5
      ban: -3.0
      approved: 2.5
      etf: 1.5

# Event clustering / deduplication (Phase 6)
clustering:
  # Cosine similarity threshold for grouping articles as same event
  # Tuned on real RSS data (117 articles, mostly short descriptions):
  #   True duplicates: 0.31-0.64 with TF-IDF cosine
  #   False positives start below 0.28
  # 0.30 catches SocksEscort(0.35), NK sanctions(0.32), Custodia(0.31)
  # while avoiding Paraguay/BTC-tax(0.28), Bitcoin-miners/AI(0.26)
  similarity_threshold: 0.30
  # Max time window for articles to be considered same event
  time_window_hours: 48
  # Novelty decay rate (lambda): novelty = exp(-lambda * hours)
  # At 0.1: ~50% decay after 7 hours, ~10% after 23 hours
  novelty_lambda: 0.1

# Source credibility tiers
source_credibility:
  tier_1:
    weight: 1.0
    sources:
      - "Reuters"
      - "Bloomberg"
      - "SEC"
      - "CFTC"
      - "Federal Reserve"
      - "Treasury"
      - "Binance Blog"
      - "Coinbase Blog"
      - "Kraken Blog"
  tier_2:
    weight: 0.7
    sources:
      - "CoinDesk"
      - "The Block"
      - "CoinTelegraph"
      - "Decrypt"
      - "Bitcoin Magazine"
      - "Wall Street Journal"
      - "Financial Times"
      - "New York Times"
      - "Washington Post"
  tier_3:
    weight: 0.4
    sources:
      - "reddit/cryptocurrency"
      - "reddit/bitcoin"
      - "reddit/ethereum"
      - "Bitcoinist"
      - "NewsBTC"
      - "U.Today"
      - "Crypto Briefing"
      - "BeInCrypto"
      - "AMBCrypto"
  tier_4:
    weight: 0.1
    sources: []

# Multi-factor signal model (Phase 7)
signal_model:
  weights:
    news: 0.40
    market: 0.25
    narrative: 0.20
    novelty: 0.15
  thresholds:
    high: 0.7       # score > 0.7 = HIGH confidence
    medium: 0.4     # score 0.4-0.7 = MEDIUM confidence
    noise: 0.4      # score < 0.4 = no signal
  # Minimum factors that must align (out of: news, market, narrative)
  min_confirmation_factors: 2
  # Market confirmation settings
  volume_lookback: 20          # periods for volume z-score baseline
  volume_zscore_threshold: 1.0 # z-score required for volume confirmation
  atr_period: 14               # periods for Average True Range
  high_vol_atr_multiplier: 1.5 # multiplier for high-volatility regime

# Event classification (Phase 2)
event_classification:
  # Severity thresholds
  default_severity: 2

# Analysis settings (Phase 3)
analysis:
  # Time windows to measure price impact (hours)
  impact_windows:
    - 1
    - 4
    - 24
  # Minimum sample size for statistical significance
  min_sample_size: 10
  # P-value threshold
  significance_level: 0.05

# Backtester settings (Phase 3)
backtester:
  # Transaction cost estimates
  spread_pct: 0.10
  slippage_pct: 0.05
  # Default position sizing (fraction of portfolio)
  position_size: 0.10
  # Default exit: time-based (hours)
  default_exit_hours: 24

# Enhanced backtester (Phase 8)
enhanced_backtester:
  # Latency buffer: minutes between event detection and simulated entry
  latency_minutes: 15
  # Cost model (per side unless noted)
  fee_pct: 0.10            # trading fee per side
  spread_pct: 0.05         # bid-ask spread cost
  slippage_pct: 0.05       # slippage cost
  # Total round-trip: 2*0.10 + 0.05 + 0.05 = 0.30%
  # Position sizing mode: fixed, confidence, kelly
  sizing_mode: "fixed"
  base_position: 0.10      # 10% of portfolio per trade
  # Walk-forward parameters
  wf_min_train_days: 14    # minimum training window
  wf_test_days: 7          # out-of-sample test window

# Dashboard (Phase 4)
dashboard:
  host: "localhost"
  port: 8501
  title: "Crypto News Research Engine"
